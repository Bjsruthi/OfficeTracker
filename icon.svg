<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="96" cy="96" r="96" fill="url(#bgGradient)"/>
  
  <!-- Calendar Card -->
  <rect x="32" y="40" width="128" height="112" rx="12" fill="#ffffff" opacity="0.95"/>
  
  <!-- Calendar Header Bar -->
  <rect x="32" y="40" width="128" height="20" rx="12" fill="#8b5cf6"/>
  
  <!-- Calendar Grid Lines -->
  <line x1="48" y1="68" x2="176" y2="68" stroke="#e0d5ff" stroke-width="1"/>
  <line x1="48" y1="82" x2="176" y2="82" stroke="#e0d5ff" stroke-width="1"/>
  <line x1="48" y1="96" x2="176" y2="96" stroke="#e0d5ff" stroke-width="1"/>
  <line x1="48" y1="110" x2="176" y2="110" stroke="#e0d5ff" stroke-width="1"/>
  <line x1="48" y1="124" x2="176" y2="124" stroke="#e0d5ff" stroke-width="1"/>
  
  <!-- Vertical Lines -->
  <line x1="68" y1="68" x2="68" y2="140" stroke="#e0d5ff" stroke-width="1"/>
  <line x1="88" y1="68" x2="88" y2="140" stroke="#e0d5ff" stroke-width="1"/>
  <line x1="108" y1="68" x2="108" y2="140" stroke="#e0d5ff" stroke-width="1"/>
  <line x1="128" y1="68" x2="128" y2="140" stroke="#e0d5ff" stroke-width="1"/>
  <line x1="148" y1="68" x2="148" y2="140" stroke="#e0d5ff" stroke-width="1"/>
  <line x1="168" y1="68" x2="168" y2="140" stroke="#e0d5ff" stroke-width="1"/>
  
  <!-- Office Building Emoji in Center -->
  <g transform="translate(96, 104)">
    <!-- Building -->
    <rect x="-8" y="-12" width="16" height="18" fill="#333333" rx="1"/>
    <!-- Windows -->
    <rect x="-6" y="-10" width="2" height="2" fill="#a855f7"/>
    <rect x="-1" y="-10" width="2" height="2" fill="#a855f7"/>
    <rect x="4" y="-10" width="2" height="2" fill="#a855f7"/>
    <rect x="-6" y="-6" width="2" height="2" fill="#a855f7"/>
    <rect x="-1" y="-6" width="2" height="2" fill="#a855f7"/>
    <rect x="4" y="-6" width="2" height="2" fill="#a855f7"/>
    <rect x="-6" y="-2" width="2" height="2" fill="#a855f7"/>
    <rect x="-1" y="-2" width="2" height="2" fill="#a855f7"/>
    <rect x="4" y="-2" width="2" height="2" fill="#a855f7"/>
  </g>
  
  <!-- Calendar Circles (marked days) -->
  <circle cx="58" cy="75" r="3" fill="#a855f7" opacity="0.8"/>
  <circle cx="98" cy="89" r="3" fill="#a855f7" opacity="0.8"/>
  <circle cx="138" cy="103" r="3" fill="#a855f7" opacity="0.8"/>
  <circle cx="78" cy="117" r="3" fill="#a855f7" opacity="0.8"/>
</svg>