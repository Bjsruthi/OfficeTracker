<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#8b5cf6">
    <meta name="description" content="A simple calendar to track office days">

    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icon.svg">

    <title>Office Calendar</title>

    <!-- React -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #root {
            width: 100%;
            max-width: 600px;
        }

        .calendar-container {
            background: #0f3460;
            border-radius: 16px;
            padding: 2rem;
            border: 1px solid rgba(139, 92, 246, 0.25);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .instruction {
            text-align: center;
            color: #a78bfa;
            font-size: 13px;
            margin-bottom: 1.5rem;
        }

        .calendar-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 1.5rem;
        }

        .calendar-header button {
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.3);
            color: #a78bfa;
            font-size: 24px;
            cursor: pointer;
            padding: 8px 14px;
            border-radius: 8px;
        }

        .calendar-header button:hover {
            background: rgba(139, 92, 246, 0.25);
        }

        .calendar-header h2 {
            flex: 1;
            text-align: center;
            color: #e0d5ff;
            font-size: 22px;
        }

        .stats-card {
            background: rgba(139, 92, 246, 0.12);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .stats-label {
            color: #a78bfa;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .stats-value {
            color: #d8b4fe;
            font-size: 32px;
            font-weight: bold;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .weekday-header {
            text-align: center;
            color: #a78bfa;
            font-size: 11px;
            font-weight: bold;
            padding: 8px 0;
        }

        .day-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 3px;

            background: rgba(51, 65, 85, 0.4);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 10px;

            color: #cbd5e1;
            font-size: 14px;
            font-weight: 600;

            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        .day-cell:hover {
            background: rgba(139, 92, 246, 0.2);
        }

        .day-cell.office-day {
            background: linear-gradient(
                135deg,
                rgba(168, 85, 247, 0.7),
                rgba(147, 51, 234, 0.6)
            );

            border-color: rgba(168, 85, 247, 0.9);
            color: #f3e8ff;
        }

        .day-cell.empty {
            background: transparent;
            border: none;
            cursor: default;
        }

        .emoji {
            font-size: 17px;
        }

        .footer {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(139, 92, 246, 0.2);
        }

        @media (max-width: 500px) {
            body {
                padding: 10px;
            }

            .calendar-container {
                padding: 1.2rem;
            }

            .calendar-header h2 {
                font-size: 18px;
            }

            .calendar-grid {
                gap: 5px;
            }

            .day-cell {
                border-radius: 8px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

    function OfficeCalendar() {

        const [currentDate, setCurrentDate] =
            React.useState(new Date());

        const [officeDays, setOfficeDays] =
            React.useState(() => {

                try {
                    const saved =
                        localStorage.getItem("officeDays");

                    return saved ? JSON.parse(saved) : {};
                }
                catch {
                    return {};
                }

            });

        // Save office days
        React.useEffect(() => {

            localStorage.setItem(
                "officeDays",
                JSON.stringify(officeDays)
            );

        }, [officeDays]);


        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();


        // First and last day of month
        const firstDay =
            new Date(year, month, 1);

        const lastDay =
            new Date(year, month + 1, 0);

        const daysInMonth =
            lastDay.getDate();

        const startingDay =
            firstDay.getDay();


        // Create calendar days
        const days = [];

        for (let i = 0; i < startingDay; i++) {
            days.push(null);
        }

        for (let day = 1; day <= daysInMonth; day++) {
            days.push(day);
        }


        // Create unique key
        const getKey = (day) =>
            `${year}-${month}-${day}`;


        // Check office day
        const isOfficeDay = (day) =>
            officeDays[getKey(day)];


        // Toggle office day
        const toggleOfficeDay = (day) => {

            if (!day) return;

            const key = getKey(day);

            setOfficeDays(previous => {

                const updated = {
                    ...previous
                };

                if (updated[key]) {
                    delete updated[key];
                }
                else {
                    updated[key] = true;
                }

                return updated;

            });

        };


        // Count office days
        const officeCount =
            Object.keys(officeDays)
                .filter(key => {

                    const [y, m] =
                        key.split("-");

                    return (
                        Number(y) === year &&
                        Number(m) === month
                    );

                })
                .length;


        // Previous month
        const previousMonth = () => {

            setCurrentDate(
                new Date(year, month - 1, 1)
            );

        };


        // Next month
        const nextMonth = () => {

            setCurrentDate(
                new Date(year, month + 1, 1)
            );

        };


        const monthName =
            currentDate.toLocaleString(
                "default",
                { month: "long" }
            );


        const weekDays =
            ["Sun", "Mon", "Tue", "Wed",
             "Thu", "Fri", "Sat"];


        return (

            <div className="calendar-container">

                <div className="instruction">
                    📅 Double-click a day to mark it as an office day
                </div>


                <div className="calendar-header">

                    <button
                        onClick={previousMonth}
                        aria-label="Previous month"
                    >
                        ←
                    </button>


                    <h2>
                        {monthName} {year}
                    </h2>


                    <button
                        onClick={nextMonth}
                        aria-label="Next month"
                    >
                        →
                    </button>

                </div>


                <div className="stats-card">

                    <div className="stats-label">
                        Office days this month
                    </div>

                    <div className="stats-value">
                        {officeCount}
                    </div>

                </div>


                <div className="calendar-grid">

                    {weekDays.map(day => (

                        <div
                            key={day}
                            className="weekday-header"
                        >
                            {day}
                        </div>

                    ))}


                    {days.map((day, index) => (

                        <div
                            key={index}

                            className={
                                `day-cell
                                ${!day ? "empty" : ""}
                                ${day && isOfficeDay(day)
                                    ? "office-day"
                                    : ""}`
                            }

                            onDoubleClick={() =>
                                toggleOfficeDay(day)
                            }
                        >

                            {day && (

                                <>
                                    <span>{day}</span>

                                    {isOfficeDay(day) && (
                                        <span className="emoji">
                                            🏢
                                        </span>
                                    )}
                                </>

                            )}

                        </div>

                    ))}

                </div>


                <div className="footer">
                    Office days are saved automatically
                </div>

            </div>

        );

    }


    const root =
        ReactDOM.createRoot(
            document.getElementById("root")
        );

    root.render(<OfficeCalendar />);

</script>


<script>

    // Register service worker
    if ("serviceWorker" in navigator) {

        window.addEventListener("load", () => {

            navigator.serviceWorker
                .register("./service-worker.js")
                .then(() => {
                    console.log(
                        "Service Worker registered"
                    );
                })
                .catch(error => {
                    console.log(
                        "Service Worker registration failed:",
                        error
                    );
                });

        });

    }

</script>

</body>
</html>
